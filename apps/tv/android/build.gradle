// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// expo-modules-core's Android Studio sync-only PCH task splits compiler
// commands on literal spaces, which corrupts quoted Windows paths when the
// project directory contains spaces (for example, "fireTV APP"). The real
// native build creates its own PCH through Ninja, so skip only this IDE stub
// task in that case; regular C++ compilation remains enabled.
gradle.projectsEvaluated {
  if (System.getProperty("os.name").toLowerCase().contains("windows") && rootDir.absolutePath.contains(" ")) {
    def expoModulesCoreProject = findProject(":expo-modules-core")
    def stubPchTask = expoModulesCoreProject?.tasks?.findByName("generateStubPCH")
    if (stubPchTask != null) {
      stubPchTask.enabled = false
    }
  }
}
